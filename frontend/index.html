<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Excelium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Excelium</h1>

<div id="dropzone">
  Clique ou glisse un fichier .xlsx
  <input type="file" id="file-input" accept=".xlsx">
</div>

<div id="status"></div>
<div id="grids"></div>

<script>
  const dropzone  = document.getElementById('dropzone')
  const fileInput = document.getElementById('file-input')
  const status    = document.getElementById('status')
  const grids     = document.getElementById('grids')

  dropzone.addEventListener('click', () => fileInput.click())
  dropzone.addEventListener('drop', e => {
    e.preventDefault()
    if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0])
  })
  dropzone.addEventListener('dragover', e => e.preventDefault())
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) upload(e.target.files[0])
  })

  async function upload(file) {
    status.className = ''
    status.textContent = 'Analyse en cours…'
    grids.innerHTML = ''

    const form = new FormData()
    form.append('file', file)

    try {
      const res  = await fetch('/api/workbook', { method: 'POST', body: form })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || 'Erreur inconnue')
      status.textContent = ''
      renderAll(data)
    } catch (e) {
      status.className = 'error'
      status.textContent = e.message
    }
  }

  function cell(value) {
    if (value === null || value === undefined) return '<span class="null">NULL</span>'
    return String(value)
  }

  function renderTable(t) {
    const headers = t.columns.map(col =>
      `<th>${col.name}</th>`
    ).join('')

    const rows = t.rows.map(row =>
      '<tr>' + row.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>'
    ).join('')

    return `
      <div class="grid-block">
        <h2>${t.table} <small>(${t.columns.length} colonnes · ${t.rows.length} lignes)</small></h2>
        <table>
          <thead><tr>${headers}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`
  }

  function renderAll(tables) {
    grids.innerHTML = tables.map(renderTable).join('')
  }
</script>

</body>
</html>
